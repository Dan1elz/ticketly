name: ticketly-web-staging

services:
  web:
    image: ticketly-web:staging
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Entra no build: mudou, tem que reconstruir a imagem (--build)
        VITE_API_URL: ${VITE_API_URL}
    # Sem "ports": quem recebe de fora é o proxy de borda (ticketly.zanni.tech).
    # Não precisa da ticketly-net: é o navegador que chama a API, não o container
    networks:
      proxy-net:
        aliases: [ticketly-web]
    restart: unless-stopped

networks:
  proxy-net:
    external: true
