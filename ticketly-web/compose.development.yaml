name: ticketly-development

services:
  web:
    image: ticketly-web:development
    build:
      context: .
      dockerfile: Dockerfile.development
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    ports:
      - 5173:5173
    networks:
      - ticketly-net
    restart: unless-stopped

networks:
  ticketly-net:
    external: true
