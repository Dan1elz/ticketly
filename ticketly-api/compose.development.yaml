name: ticketly-development

services:
  postgres:
    # A imagem oficial do postgres cria o banco e o usuário pelas variáveis de ambiente
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketly_password}
      POSTGRES_DB: ${POSTGRES_DB:-ticketly_db}
      TZ: ${DB_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ticketly_postgres_data_dev:/var/lib/postgresql/data
    networks:
      - ticketly-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketly_user} -d ${POSTGRES_DB:-ticketly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ticketly-api:development
    build:
      context: .
      dockerfile: Dockerfile.development
    volumes:
      - .:/app
      # Volume anônimo: impede que o node_modules do host sobrescreva o do container
      - /app/node_modules
    env_file:
      - .env
    environment:
      # Dentro do Docker a API não acha o banco em "localhost": usa o nome do serviço e a porta interna
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - ticketly-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

networks:
  ticketly-net:
    external: true

volumes:
  ticketly_postgres_data_dev:
