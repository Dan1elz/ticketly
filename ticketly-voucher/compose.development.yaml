name: ticketly-development

services:
  voucher:
    image: ticketly-voucher:development
    build:
      context: .
      dockerfile: Dockerfile.development
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - ticketly-net
    restart: unless-stopped

networks:
  ticketly-net:
    external: true
