# Aqui é onde vamos configurar o ambiente de desenvolvimento subindo 3 serviços, Storage(Silo), RabbitMQ e Redis. 
# O Postgres não vai ficar aqui pois para essa arquitetura, decidi que ele é acoplado a api principal. 
name: ticketly-development

services:
  # Configuração do storage, que é um serviço de armazenamento de objetos compatível com S3.
  storage:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    # Só em 127.0.0.1: no PC abre em localhost; na VM ninguém de fora alcança.
    # O acesso público (URLs assinadas, fotos) vem pelo proxy de borda: ticketly-s3.zanni.tech
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"           # API S3
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"   # painel web (na VM: túnel SSH)
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD}
    volumes:
      - ticketly_storage_data_dev:/data
    command: server /data --console-address ":9001"
    networks:
      # Rede privada do projeto: api, fiscal e voucher usam http://storage:9000
      ticketly-net:
      # Rede do proxy de borda (~/projects/nginx). Alias único: o nginx usa ticketly-s3-dev:9000
      proxy-net:
        aliases: [ticketly-s3-dev]
    restart: unless-stopped
    healthcheck:
        test: ["CMD", "mc", "ready", "local"]
        interval: 5s
        timeout: 5s
        retries: 5

  # Configuração do serviço de inicialização do storage, que cria os buckets necessários.
  storage-initial-setup:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"] #entrypoint é o comando que vai rodar quando o container iniciar
    volumes:
      - ./storage/init.sh:/init.sh:ro
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS}
    networks:
      - ticketly-net
    restart: "no" #não reinicia o container, pois ele só precisa rodar uma vez para criar os buckets
  #TODO: Serviço RabbitMQ


  #TODO: Serviço Redis


networks:
  ticketly-net:
    external: true
  proxy-net:
    external: true

volumes:
  ticketly_redis_data_dev:
  ticketly_rabbitmq_data_dev:
  ticketly_storage_data_dev: